<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NobleAI | AI Account Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <h1 class="logo">NobleAI</h1>
  <a href="services.html" style="color:#00ff99">← Back</a>
</header>

<section class="pricing">
  <h2>💼 AI Account Management</h2>
  <p>Fill in your trading account details so NobleAI can manage your account under the 40/60 profit-sharing plan.</p>

  <div class="card">
    <input type="text" placeholder="Full Name">
    <input type="email" placeholder="Email Address">
    <input type="tel" placeholder="Phone Number">

    <select>
      <option>Select Your Broker</option>
      <option>Exness</option>
      <option>Deriv</option>
      <option>IC Markets</option>
      <option>FBS</option>
      <option>XM</option>
    </select>

    <input type="text" placeholder="Trading Account Number">
    <input type="password" placeholder="Investor Password / Trading Password">
    <input type="number" placeholder="Account Balance (USD)">

    <textarea placeholder="Any special instructions for NobleAI?" rows="4"></textarea>

    <button class="btn green" onclick="submitAccount()">
  Submit Account to NobleAI
</button>
  </div>
</section>
<script>
function submitAccount() {
  alert("Your trading details have been submitted successfully. Please continue to WhatsApp to complete verification.");
  window.location.href =
    "https://wa.me/256765560729?text=Hello%20NobleAI,%20I%20have%20submitted%20my%20Account%20Management%20details%20and%20need%20verification.";
}
</script>
</body>
</html>
