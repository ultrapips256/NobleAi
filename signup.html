<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NobleAI Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-box">
  <h1 class="logo">NobleAI</h1>
  <h2>Create Your Account</h2>

  <input type="text" placeholder="Full Name">
  <input type="email" placeholder="Email Address">
  <input type="tel" placeholder="Phone Number">
  <input type="password" placeholder="Create Password">
  <input type="password" placeholder="Confirm Password">

  <button class="btn green" onclick="createAccount()">Create Account</button>

  <p style="margin-top:20px; text-align:center;">
    Already have an account?
    <a href="login.html" style="color:#00ff99;">Login</a>
  </p>

  <p style="text-align:center; margin-top:15px;">
    <a href="index.html" style="color:#00ff99;">← Back Home</a>
  </p>
</div>
<script src="script.js"></script>

<script>
function createAccount() {
  const name = document.querySelectorAll("input")[0].value;
  const email = document.querySelectorAll("input")[1].value;
  const password = document.querySelectorAll("input")[3].value;

  signup(name, email, password);
  alert("Account created successfully!");
  window.location.href = "login.html";
}
</script>
</body>
</html>
